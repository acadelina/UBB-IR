<html>
<head>
    <style>
        select, button {
            margin: 5px 10px 15px 0;
            padding: 4px 8px;
            font-size: 14px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 700px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        th {
            background-color: rgba(232, 127, 230, 0.22);
            color: rgba(179, 46, 81, 0.86);
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>

</head>

<body>
<Text>Manufacturer:</Text>
<select id="Manufacturer">
    <option></option>
    <option>Lenovo</option>
    <option>Dell</option>
    <option>HP</option>
    <option>Apple</option>
</select>
<Text>Cpu:</Text>
<select id="Cpu">
    <option></option>
    <option>Intel</option>
    <option>Apple</option>
</select>
<Text>RAM:</Text>
<select id="RAM">
    <option></option>
    <option>8GB</option>
    <option>16GB</option>
</select>
<button id="FilterBtn">Filter</button>
<br/>

<table id="Results"></table>
</body>

<script>
    var manu = document.getElementById("Manufacturer");
    var cpu = document.getElementById("Cpu");
    var ram = document.getElementById("RAM");
    var btn = document.getElementById("FilterBtn");
    var table = document.getElementById("Results");

    function buildTable(data) {
        table.innerHTML="";
        table.innerHTML+="<tr><th>Manufacturer</th><th>Model</th><th>Cpu</th><th>Ram</th></tr>";
        for(var i=0;i<data.length;i++)
            table.innerHTML+="<tr><td>"+data[i][0]+"</td><td>"+data[i][1]+"</td><td>"+data[i][2]+"</td><td>"+data[i][3]+"</td></tr>";
    }

    getJSON("devices.php", data=>{
        console.log(data);
        buildTable(data);
    });


    btn.onclick = function(){
        getJSON("devices.php?manu="+manu.value+"&cpu="+cpu.value+"&ram="+ram.value, data=>{
            console.log(data);
            buildTable(data);
        });
    }

    function getJSON(url, callback) {
        var xhttp;
        if (url == "") {
            document.getElementById("txtHint").innerHTML = "";
            return;
        }
        xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                console.log(this.responseText);
                var obj=JSON.parse(this.responseText);
                callback(obj);
            }
        };
        xhttp.open("GET", url, true);
        xhttp.send();
    }
</script>
</html>
