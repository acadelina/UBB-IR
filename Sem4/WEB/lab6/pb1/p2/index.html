<table id="tabela">
    <thead>
    <tr><th>Nume</th><th>Prenume</th><th>Telefon</th><th>Email</th></tr>
    </thead>
    <tbody></tbody>
</table>

<button id="prev">Prev</button>
<button id="next">Next</button>

<script>
    let currentPage = 1;

    function loadData(page) {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'getPage.php?page=' + page, true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                const response = JSON.parse(xhr.responseText);
                const tbody = document.querySelector('#tabela tbody');
                tbody.innerHTML = '';
                response.records.forEach(row => {
                    const tr = document.createElement('tr');
                    row.forEach(cell => {
                        const td = document.createElement('td');
                        td.textContent = cell;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                currentPage = response.currentPage;
                document.getElementById('prev').disabled = !response.hasPrev;
                document.getElementById('next').disabled = !response.hasNext;
            }
        };
        xhr.send();
    }

    document.getElementById('prev').onclick = function() {
        if(currentPage > 1) loadData(currentPage - 1);
    };

    document.getElementById('next').onclick = function() {
        loadData(currentPage + 1);
    };

    // load initial page
    loadData(1);
</script>
