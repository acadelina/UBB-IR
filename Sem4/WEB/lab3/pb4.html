<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Problema 4</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    th, td {
      padding: 5px;
      text-align: left;
      cursor: pointer;
    }
    table {
      width: 500px;
    }
    .tableheader {
      background-color: pink;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<table id="fruits">
  <thead>
  <tr>
    <th data-type="string">
      <button class="tableheader">Fructe</button>
    </th>
    <th data-type="number">
      <button class="tableheader">Cantitate</button>
    </th>
    <th data-type="number">
      <button class="tableheader">Pret</button>
    </th>
  </tr>
  </thead>
  <tbody>
  <tr>
    <td>Mere</td>
    <td>70</td>
    <td>8</td>
  </tr>
  <tr>
    <td>Pere</td>
    <td>60</td>
    <td>6</td>
  </tr>
  <tr>
    <td>Banane</td>
    <td>50</td>
    <td>9</td>
  </tr>
  <tr>
    <td>Afine</td>
    <td>50</td>
    <td>5</td>
  </tr>
  </tbody>
</table>
<table id="fruits2">
  <thead>
  <tr>
    <th data-type="string">
      <button class="tableheader">Fructe</button>
    </th>
    <th data-type="number">
      <button class="tableheader">Cantitate</button>
    </th>
    <th data-type="number">
      <button class="tableheader">Pret</button>
    </th>
  </tr>
  </thead>
  <tbody>
  <tr>
    <td>Mere</td>
    <td>70</td>
    <td>8</td>
  </tr>
  <tr>
    <td>Pere</td>
    <td>60</td>
    <td>6</td>
  </tr>
  <tr>
    <td>Banane</td>
    <td>50</td>
    <td>9</td>
  </tr>
  <tr>
    <td>Afine</td>
    <td>50</td>
    <td>5</td>
  </tr>
  </tbody>
</table>
<script>
  var table = document.getElementById("fruits");
  var table2=document.getElementById("fruits2");
  var headers2 = table2.getElementsByTagName("th");
  var tablebody2 = table2.querySelector("tbody");
  var rows2 = tablebody2.querySelectorAll("tr");
  var headers = table.querySelectorAll("th");
  var tablebody = table.querySelector("tbody");
  var rows = tablebody.querySelectorAll("tr");

  const direct = Array.from(headers).map(function() {
    return '';
  });
  const direct2 = Array.from(headers2).map(function() {
    return '';
  });

  function transform(index, content) {
    var type = headers[index].getAttribute("data-type");
    switch (type) {
      case "number":
        return parseInt(content);
      case "string":
        return content;
      default:
        return content;
    }
  }

  function sortColumn(index) {
    var newRows = Array.from(rows);
    var direction = direct[index] || 'asc';
    var multiplier = (direction === 'asc') ? 1 : -1;

    newRows.sort(function(a, b) {
      var cella = a.querySelectorAll('td')[index].innerHTML;
      var cellb = b.querySelectorAll('td')[index].innerHTML;

      var c = transform(index, cella);
      var d = transform(index, cellb);

      if (c > d) return multiplier;
      if (c < d) return -1 * multiplier;
      return 0;
    });

    newRows.forEach(function(row) {
      tablebody.appendChild(row);
    });

    direct[index] = (direction === 'asc') ? 'desc' : 'asc';
    rows = tablebody.querySelectorAll("tr");
  }

  headers.forEach(function(header, index) {
    header.addEventListener('click', function() {
      sortColumn(index);
    });
  });
</script>

</body>
</html>
