<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Problema 2</title>
</head>
<body>
<div>
  <form>
    Nume: <input type="text" id="nume" ><br>
    Data nasterii: <input type="date" id="data"  ><br>
    Varsta: <input type="number" id="varsta" ><br>
    Email: <input type="email" id="email" ><br>
    <span id="Message"></span><br>
    <button type="button" onclick="validate()">Submit</button>
  </form>
</div>
<script>

  function validateDate(birthday) {
    let dt1 = new Date();
    const dt2 = new Date(birthday.value.toString());
    return !(dt2 < dt1);
  }

  function validateAge(age, dt1, dt2) {
    let varsta = dt1.getFullYear() - dt2.getFullYear();
    return Number(age.value.toString() )=== varsta;

  }

  function validateEmail(email) {
    return String(email)
      .toLowerCase()
      .match(
        /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|.(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
      );
  }

  function validate() {
    const name = document.getElementById("nume");
    const bday = document.getElementById("data");
    const age = document.getElementById("varsta");
    const email = document.getElementById("email");

    let errors = "";

    if(!/^[a-zA-Z ]+$/.test( name.value)) {
      errors += "The name field can't contain digits!\n";
      name.style.borderColor = "red";
    } else {
      name.style.borderColor = "green";
    }

    if (validateDate(bday)) {
      errors += "Invalid date!\n";
      bday.style.borderColor = "red";
    } else {
      bday.style.borderColor = "green";
    }

    let date1 = new Date();
    const date2 = new Date(bday.value.toString());

    if (!validateAge(age, date1, date2) || age.value == null) {
      errors += "Invalid age!\n";
      age.style.borderColor = "red";
    } else {
      age.style.borderColor = "green";
    }

    if (!validateEmail(email.value) || email.value == null) {
      errors += "Invalid email!\n";
      email.style.borderColor = "red";
    } else {
      email.style.borderColor = "green";
    }

    if (errors.length > 0) {
      window.alert(errors);
    } else {
      window.alert("All's well!");
    }
  }
</script>
</body>

</html>
