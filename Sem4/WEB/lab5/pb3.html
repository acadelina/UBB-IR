<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problema 3</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            background: #e2edf8;
        }

        .game {
            display: flex;
            flex-wrap: wrap;
            margin: auto;
            width: 640px;
            height: 640px;
            perspective: 1000px;
        }

        .patrat {
            width: calc(25% - 10px);
            height: calc(33.33% - 10px);
            position: relative;
            margin: 5px;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, .3);
            transform: scale(1);
            transform-style: preserve-3d;
            transition: transform .5s;

            cursor: pointer;
        }

        .patrat:active {
            transform: scale(0.95);
            transition: transform .2s;
        }

        .patrat.flip {
            transform: rotateX(180deg);
        }

        .front, .back {
            width: 100%;
            height: 100%;
            padding: 20px;
            position: absolute;
            border-radius: 5px;
            background: rgba(179, 46, 81, 0.86);
            backface-visibility: hidden;
            transform-origin: bottom;
        }

        .back {
            transform: rotateX(0deg);
        }
        .front {
            transform: rotateX(180deg);
        }

        #wonDiv {
            justify-content: center;
            align-items: center;
            display: flex;
            position: absolute;
            flex-wrap: wrap;
            margin-left: 750px;
        }

        #wonText {
            font-size: xx-large;
            position: relative;
            color: darkgreen;
        }
    </style>
</head>
<body>
<section class="game">
    <div class="patrat" data-fruct="banane">
        <img class="front" src="img/banane.webp" alt="banane">
        <img class="back" src="img/download.png" alt="pink">
    </div>
    <div class="patrat" data-fruct="banane">
        <img class="front" src="img/banane.webp" alt="banane">
        <img class="back" src="img/download.png" alt="pink">
    </div>
    <div class="patrat" data-fruct="capsuna">
        <img class="front" src="img/capsuna.jpg" alt="capsuna">
        <img class="back" src="img/download.png" alt="pink">
    </div>
    <div class="patrat" data-fruct="capsuna">
        <img class="front" src="img/capsuna.jpg" alt="capsuna">
        <img class="back" src="img/download.png" alt="pink">
    </div>
    <div class="patrat" data-fruct="harbuz">
        <img class="front" src="img/harbuz.jpg" alt="harbuz">
        <img class="back" src="img/download.png" alt="pink">
    </div>
    <div class="patrat" data-fruct="harbuz">
        <img class="front" src="img/harbuz.jpg" alt="harbuz">
        <img class="back" src="img/download.png" alt="pink">
    </div>
    <div class="patrat" data-fruct="kiwi">
        <img class="front" src="img/kiwi.jpg" alt="kiwi">
        <img class="back" src="img/download.png" alt="pink">
    </div>
    <div class="patrat" data-fruct="kiwi">
        <img class="front" src="img/kiwi.jpg" alt="kiwi">
        <img class="back" src="img/download.png" alt="pink">
    </div>
</section>
<div id="wonDiv">
    <p id="wonText"></p>
</div>

<script>
    $(document).ready(function () {
        let flipped = false;
        let $first = null, $second = null;
        let lockBoard = false;
        let matchCounter = 0;
        let clickCount = 0;


        $('.patrat').each(function () {
            $(this).css('order', Math.floor(Math.random() * 12));
        });

        function resetBoard() {
            flipped = false;
            lockBoard = false;
            $first = null;
            $second = null;
        }

        function checkMatches() {
            clickCount += 2;
            if ($first.data('fruct') === $second.data('fruct')) {
                $first.off('click');
                $second.off('click');
                matchCounter++;

                if (matchCounter >= 4) {
                    setTimeout(() => {
                        alert("You won!");
                        $('#wonText').text("Congrats! You won in: " + clickCount + " clicks!");
                    }, 1000);
                }
                resetBoard();
            } else {
                lockBoard = true;
                setTimeout(() => {
                    $first.removeClass('flip');
                    $second.removeClass('flip');
                    resetBoard();
                }, 1000);
            }
        }

        $('.patrat').on('click', function () {
            if (lockBoard || $(this).is($first)) return;

            $(this).addClass('flip');

            if (!flipped) {
                flipped = true;
                $first = $(this);
                return;
            }

            $second = $(this);
            checkMatches();
        });
    });
</script>
</body>
</html>
